<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vazin Reviews</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px 80px;
}

.hero {
  text-align: center;
  padding: 30px 0 35px;
}

.cat {
  font-size: 42px;
}

h1 {
  margin: 10px 0 4px;
  font-size: 42px;
  letter-spacing: 5px;
}

.subtitle {
  color: #aaa;
  letter-spacing: 3px;
  font-size: 14px;
}

.thanks {
  margin: 25px auto;
  color: #ddd;
  line-height: 1.8;
}

.rating-box {
  border: 1px solid #333;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  margin: 20px 0 30px;
}

.big-rating {
  font-size: 52px;
  font-weight: bold;
}

.stars-display {
  font-size: 28px;
  letter-spacing: 4px;
  margin: 5px 0;
}

.review-count {
  color: #888;
  font-size: 14px;
}

.write-btn {
  width: 100%;
  padding: 17px;
  border: 1px solid white;
  border-radius: 14px;
  background: white;
  color: #0b0b0b;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

.form-box {
  display: none;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 25px;
  margin-top: 20px;
}

.form-box.show {
  display: block;
}

label {
  display: block;
  margin: 18px 0 8px;
  color: #ccc;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #151515;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.star-picker {
  display: flex;
  gap: 8px;
  margin: 10px 0;
}

.star {
  font-size: 34px;
  color: #444;
  cursor: pointer;
}

.star.selected {
  color: white;
}

.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: white;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

.reviews-title {
  margin-top: 45px;
  margin-bottom: 15px;
  letter-spacing: 2px;
}

.review-card {
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
  background: #101010;
}

.review-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.reviewer {
  font-weight: bold;
}

.review-stars {
  letter-spacing: 2px;
}

.review-text {
  margin-top: 12px;
  color: #ddd;
  line-height: 1.7;
  white-space: pre-wrap;
}

.review-date {
  margin-top: 12px;
  color: #666;
  font-size: 12px;
}

.empty {
  color: #777;
  text-align: center;
  padding: 30px 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <div class="cat">🐈</div>
    <h1>VAZIN</h1>
    <div class="subtitle">CUSTOMER REVIEWS</div>

    <div class="thanks">
      ขอบคุณลูกค้าทุกคนที่ไว้วางใจและฝากรีวิวให้ร้านนะคะ ♡
    </div>
  </div>

  <div class="rating-box">
    <div class="big-rating" id="averageRating">0.0</div>
    <div class="stars-display" id="averageStars">☆☆☆☆☆</div>
    <div class="review-count" id="reviewCount">0 Reviews</div>
  </div>

  <button class="write-btn" onclick="toggleForm()">
    ♡ WRITE A REVIEW ♡
  </button>

  <div class="form-box" id="reviewForm">

    <label for="name">Name / Name in game</label>
    <input
      id="name"
      type="text"
      placeholder="กรอกชื่อของคุณ"
      maxlength="100"
    >

    <label>Rating</label>

    <div class="star-picker">
      <span class="star" data-star="1" onclick="selectStar(1)">★</span>
      <span class="star" data-star="2" onclick="selectStar(2)">★</span>
      <span class="star" data-star="3" onclick="selectStar(3)">★</span>
      <span class="star" data-star="4" onclick="selectStar(4)">★</span>
      <span class="star" data-star="5" onclick="selectStar(5)">★</span>
    </div>

    <label for="review">Your Review</label>

    <textarea
      id="review"
      placeholder="เขียนรีวิวของคุณที่นี่ ♡"
      maxlength="2000"
    ></textarea>

    <button class="submit-btn" onclick="submitReview()">
      SEND REVIEW ♡
    </button>

  </div>

  <h2 class="reviews-title">CUSTOMER REVIEWS</h2>

  <div id="reviewsList">
    <div class="empty">กำลังโหลดรีวิว...</div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://acvundxtmksvfgubpiue.supabase.co';

const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_pVnuExkW_GHdS0B4z3ckIg_rExDM3vO';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let selectedStar = 0;

function toggleForm() {
  document.getElementById('reviewForm').classList.toggle('show');
}

function selectStar(number) {
  selectedStar = number;

  document.querySelectorAll('.star').forEach(star => {
    const value = Number(star.dataset.star);

    if (value <= number) {
      star.classList.add('selected');
    } else {
      star.classList.remove('selected');
    }
  });
}

async function submitReview() {

  const name = document.getElementById('name').value.trim();
  const review = document.getElementById('review').value.trim();

  if (!name || !selectedStar || !review) {
    alert('กรุณากรอกข้อมูลให้ครบค่ะ ♡');
    return;
  }

  const button = document.querySelector('.submit-btn');
  button.disabled = true;
  button.textContent = 'กำลังส่งรีวิว...';

  const { error } = await supabaseClient
    .from('reviews')
    .insert({
      name: name,
      stars: selectedStar,
      review: review
    });

  if (error) {
    console.error(error);
    alert('ส่งรีวิวไม่สำเร็จค่ะ: ' + error.message);

    button.disabled = false;
    button.textContent = 'SEND REVIEW ♡';
    return;
  }

  alert('ส่งรีวิวเรียบร้อยแล้วค่ะ ขอบคุณมากนะคะ ♡');

  document.getElementById('name').value = '';
  document.getElementById('review').value = '';

  selectedStar = 0;

  document.querySelectorAll('.star').forEach(star => {
    star.classList.remove('selected');
  });

  button.disabled = false;
  button.textContent = 'SEND REVIEW ♡';

  document.getElementById('reviewForm').classList.remove('show');

  await loadReviews();
}

async function loadReviews() {

  const { data, error } = await supabaseClient
    .from('reviews')
    .select('id, name, stars, review, created_at')
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);

    document.getElementById('reviewsList').innerHTML =
      '<div class="empty">ไม่สามารถโหลดรีวิวได้</div>';

    return;
  }

  const reviews = data || [];

  document.getElementById('reviewCount').textContent =
    reviews.length + (reviews.length === 1 ? ' Review' : ' Reviews');

  if (reviews.length === 0) {

    document.getElementById('averageRating').textContent = '0.0';
    document.getElementById('averageStars').textContent = '☆☆☆☆☆';

    document.getElementById('reviewsList').innerHTML =
      '<div class="empty">ยังไม่มีรีวิวค่ะ ♡<br>เป็นคนแรกที่รีวิวให้ร้านได้นะคะ</div>';

    return;
  }

  const total = reviews.reduce(
    (sum, item) => sum + Number(item.stars),
    0
  );

  const average = total / reviews.length;

  document.getElementById('averageRating').textContent =
    average.toFixed(1);

  document.getElementById('averageStars').textContent =
    getStars(Math.round(average));

  const list = document.getElementById('reviewsList');

  list.innerHTML = '';

  reviews.forEach(item => {

    const card = document.createElement('div');
    card.className = 'review-card';

    const top = document.createElement('div');
    top.className = 'review-top';

    const reviewer = document.createElement('div');
    reviewer.className = 'reviewer';
    reviewer.textContent = item.name;

    const stars = document.createElement('div');
    stars.className = 'review-stars';
    stars.textContent = getStars(Number(item.stars));

    top.appendChild(reviewer);
    top.appendChild(stars);

    const text = document.createElement('div');
    text.className = 'review-text';
    text.textContent = item.review;

    const date = document.createElement('div');
    date.className = 'review-date';

    if (item.created_at) {
      date.textContent = new Date(item.created_at).toLocaleDateString(
        'th-TH',
        {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }
      );
    }

    card.appendChild(top);
    card.appendChild(text);
    card.appendChild(date);

    list.appendChild(card);
  });
}

function getStars(number) {
  return '★'.repeat(number) + '☆'.repeat(5 - number);
}

loadReviews();
</script>

</body>
</html>
