<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VAZIN | Customer Reviews</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
  font-family: inherit;
}

/* =========================
   TOP NAV
========================= */

.navbar {
  height: 72px;
  padding: 0 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: rgba(8,8,8,0.96);
  border-bottom: 1px solid #222;

  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 15px;

  font-size: 22px;
  font-weight: bold;
  letter-spacing: 8px;
}

.logo-cat {
  font-size: 27px;
}

.music-button {
  border: 1px solid #555;
  background: transparent;
  color: white;

  padding: 10px 17px;
  border-radius: 30px;

  font-size: 13px;
  letter-spacing: 1px;

  cursor: pointer;
}

/* =========================
   HERO
========================= */

.hero {
  text-align: center;
  padding-bottom: 40px;
}

.cover {
  width: 100%;
  height: 360px;

  background-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.05),
      #080808 95%
    ),
    url("cover.jpg");

  background-size: cover;
  background-position: center;

  position: relative;
}

.profile-wrap {
  position: absolute;

  left: 50%;
  bottom: -70px;

  transform: translateX(-50%);
}

.profile {
  width: 145px;
  height: 145px;

  border-radius: 50%;

  border: 5px solid #080808;
  outline: 2px solid white;

  object-fit: cover;

  background: #111;
}

.crown {
  position: absolute;

  top: -20px;
  left: 50%;

  transform: translateX(-50%);

  font-size: 34px;
}

.hero-content {
  padding: 105px 20px 0;
}

.hero-content h1 {
  margin: 0;

  font-family: Georgia, serif;

  font-size: clamp(55px, 10vw, 90px);

  letter-spacing: 7px;
}

.subtitle {
  margin-top: 10px;

  font-size: 17px;
  letter-spacing: 8px;

  color: #ddd;
}

.tagline {
  margin-top: 30px;

  font-size: 20px;
  color: #ddd;
}

.sparkle {
  color: white;
}

/* =========================
   CREDIT
========================= */

.credit-button {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 14px;

  margin-top: 25px;

  padding: 14px 25px;

  border: 1px solid #777;
  border-radius: 40px;

  color: white;
  text-decoration: none;

  font-size: 15px;
  letter-spacing: 1px;

  transition: 0.25s;
}

.credit-button:hover {
  background: white;
  color: black;
}

/* =========================
   MAIN
========================= */

.container {
  width: min(900px, calc(100% - 30px));
  margin: auto;
}

/* =========================
   RATING
========================= */

.rating-box {
  margin-top: 55px;

  padding: 30px 20px;

  border: 1px solid #333;
  border-radius: 25px;

  text-align: center;

  background: linear-gradient(
    145deg,
    #0e0e0e,
    #090909
  );
}

.big-rating {
  font-size: 65px;
  font-weight: bold;
}

.average-stars {
  font-size: 30px;
  letter-spacing: 5px;
  margin-top: 5px;
}

.review-count {
  margin-top: 8px;
  color: #888;
}

/* =========================
   WRITE REVIEW
========================= */

.write-button {
  width: 100%;

  margin-top: 28px;

  padding: 20px;

  border: none;
  border-radius: 18px;

  background: white;
  color: black;

  font-size: 16px;
  font-weight: bold;

  letter-spacing: 4px;

  cursor: pointer;

  transition: 0.25s;
}

.write-button:hover {
  transform: translateY(-2px);
}

/* =========================
   FORM
========================= */

.form-box {
  display: none;

  margin-top: 20px;

  padding: 25px;

  border: 1px solid #333;
  border-radius: 22px;

  background: #101010;
}

.form-box.show {
  display: block;
}

label {
  display: block;

  margin: 17px 0 8px;

  color: #ccc;
}

input,
textarea {
  width: 100%;

  padding: 14px;

  border-radius: 12px;

  border: 1px solid #444;

  background: #151515;
  color: white;

  font-size: 16px;

  outline: none;
}

input:focus,
textarea:focus {
  border-color: white;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.star-picker {
  display: flex;
  gap: 7px;
}

.star {
  font-size: 36px;
  color: #444;
  cursor: pointer;
}

.star.selected {
  color: white;
}

.submit-button {
  width: 100%;

  margin-top: 20px;

  padding: 16px;

  border: none;
  border-radius: 12px;

  background: white;
  color: black;

  font-weight: bold;

  cursor: pointer;
}

/* =========================
   REVIEWS TITLE
========================= */

.section-title {
  display: flex;

  align-items: center;
  gap: 20px;

  margin: 65px 0 25px;

  font-family: Georgia, serif;

  font-size: 22px;

  letter-spacing: 5px;

  text-align: center;
}

.section-title::before,
.section-title::after {
  content: "";

  height: 1px;

  background: #444;

  flex: 1;
}

/* =========================
   REVIEW CARD
========================= */

.review-card {
  position: relative;

  margin-bottom: 16px;

  padding: 24px;

  border: 1px solid #2d2d2d;
  border-radius: 22px;

  background: #0d0d0d;
}

.review-header {
  display: flex;

  align-items: center;

  gap: 15px;
}

.review-avatar {
  width: 55px;
  height: 55px;

  border-radius: 50%;

  object-fit: cover;

  border: 1px solid white;

  background: #111;
}

.reviewer-name {
  font-size: 17px;
  font-weight: bold;
}

.review-stars {
  margin-top: 5px;

  letter-spacing: 2px;
}

.review-text {
  margin-top: 18px;

  color: #ddd;

  line-height: 1.8;

  white-space: pre-wrap;
}

.review-date {
  margin-top: 12px;

  color: #666;

  font-size: 12px;
}

.empty {
  padding: 40px 20px;

  text-align: center;

  color: #777;
}

/* =========================
   FOOTER
========================= */

.footer {
  text-align: center;

  padding: 70px 20px;

  color: #777;
}

.footer-paw {
  font-size: 30px;
}

.footer-text {
  margin-top: 15px;

  font-family: Georgia, serif;

  font-size: 25px;

  color: white;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .navbar {
    padding: 0 16px;
  }

  .logo {
    font-size: 18px;
    letter-spacing: 5px;
  }

  .music-button {
    padding: 8px 12px;
    font-size: 11px;
  }

  .cover {
    height: 260px;
  }

  .profile {
    width: 125px;
    height: 125px;
  }

  .profile-wrap {
    bottom: -60px;
  }

  .hero-content {
    padding-top: 90px;
  }

  .hero-content h1 {
    font-size: 50px;
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 5px;
  }

  .tagline {
    font-size: 17px;
  }

  .section-title {
    font-size: 16px;
    letter-spacing: 3px;
  }

}

</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

  <div class="logo">
    <span class="logo-cat">🐈</span>
    VAZIN
  </div>

  <button
    class="music-button"
    onclick="toggleMusic()"
    id="musicButton"
  >
    ♫ MUSIC OFF
  </button>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="cover">

    <div class="profile-wrap">

      <div class="crown">
        ♕
      </div>

      <img
        class="profile"
        src="IMG_7496.jpeg"
        alt="VAZIN Profile"
      >

    </div>

  </div>


  <div class="hero-content">

    <h1>VAZIN</h1>

    <div class="subtitle">
      CUSTOMER REVIEWS
    </div>

    <div class="tagline">
      บริการทุกระดับประทับใจ <span class="sparkle">♡</span>
    </div>


    <!-- เปลี่ยนลิงก์ตรงนี้เป็น Google Drive ของคุณ -->

    <a
      class="credit-button"
      href="https://drive.google.com/"
      target="_blank"
      rel="noopener"
    >
      🔗 เครดิตเพิ่มเติม (คลิกดูในไดร์ฟ) →
    </a>

  </div>

</section>


<main class="container">


  <!-- =========================
       RATING
  ========================= -->

  <div class="rating-box">

    <div
      class="big-rating"
      id="averageRating"
    >
      0.0
    </div>

    <div
      class="average-stars"
      id="averageStars"
    >
      ☆☆☆☆☆
    </div>

    <div
      class="review-count"
      id="reviewCount"
    >
      0 Reviews
    </div>

  </div>


  <!-- =========================
       WRITE BUTTON
  ========================= -->

  <button
    class="write-button"
    onclick="toggleForm()"
  >
    ♡ WRITE A REVIEW ♡
  </button>


  <!-- =========================
       REVIEW FORM
  ========================= -->

  <div
    class="form-box"
    id="reviewForm"
  >

    <label>
      Name / Name in game
    </label>

    <input
      id="name"
      type="text"
      maxlength="100"
      placeholder="กรอกชื่อของคุณ"
    >


    <label>
      Rating
    </label>

    <div class="star-picker">

      <span
        class="star"
        data-star="1"
        onclick="selectStar(1)"
      >★</span>

      <span
        class="star"
        data-star="2"
        onclick="selectStar(2)"
      >★</span>

      <span
        class="star"
        data-star="3"
        onclick="selectStar(3)"
      >★</span>

      <span
        class="star"
        data-star="4"
        onclick="selectStar(4)"
      >★</span>

      <span
        class="star"
        data-star="5"
        onclick="selectStar(5)"
      >★</span>

    </div>


    <label>
      Your Review
    </label>

    <textarea
      id="review"
      maxlength="2000"
      placeholder="เขียนรีวิวของคุณที่นี่ ♡"
    ></textarea>


    <button
      class="submit-button"
      onclick="submitReview()"
    >
      SEND REVIEW ♡
    </button>

  </div>


  <!-- =========================
       REVIEWS
  ========================= -->

  <div class="section-title">
    CUSTOMER REVIEWS
  </div>

  <div id="reviewsList">

    <div class="empty">
      กำลังโหลดรีวิว...
    </div>

  </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

  <div class="footer-paw">
    🐾
  </div>

  <div class="footer-text">
    Thank you ♡
  </div>

</footer>


<!-- =========================
     MUSIC
========================= -->

<audio
  id="backgroundMusic"
  loop
>
  <source
    src="music.mp3"
    type="audio/mpeg"
  >
</audio>


<script>

/* ===================================
   SUPABASE
=================================== */

const SUPABASE_URL =
  'https://acvundxtmksvfgubpiue.supabase.co';


/*
   ใส่ Publishable Key เดิมของคุณตรงนี้
   ใช้คีย์เดิมที่เว็บใช้งานได้อยู่แล้ว
*/

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_pVnuExkW_GHdS0B4z3ckIg_rExDM3vO';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ===================================
   MUSIC
=================================== */

const music =
  document.getElementById('backgroundMusic');

const musicButton =
  document.getElementById('musicButton');


function toggleMusic() {

  if (music.paused) {

    music.play()
      .then(() => {

        musicButton.textContent =
          '♫ MUSIC ON';

      })
      .catch(() => {

        alert(
          'กรุณาแตะปุ่มอีกครั้งเพื่อเปิดเพลงค่ะ ♡'
        );

      });

  } else {

    music.pause();

    musicButton.textContent =
      '♫ MUSIC OFF';
  }
}


/* ===================================
   REVIEW
=================================== */

let selectedStar = 0;


function toggleForm() {

  document
    .getElementById('reviewForm')
    .classList
    .toggle('show');
}


function selectStar(number) {

  selectedStar = number;

  document
    .querySelectorAll('.star')
    .forEach(star => {

      const value =
        Number(star.dataset.star);

      if (value <= number) {

        star.classList.add('selected');

      } else {

        star.classList.remove('selected');

      }

    });
}


/* ===================================
   SUBMIT REVIEW
=================================== */

async function submitReview() {

  const name =
    document
      .getElementById('name')
      .value
      .trim();

  const review =
    document
      .getElementById('review')
      .value
      .trim();


  if (!name || !selectedStar || !review) {

    alert(
      'กรุณากรอกข้อมูลให้ครบค่ะ ♡'
    );

    return;
  }


  const button =
    document.querySelector(
      '.submit-button'
    );


  button.disabled = true;

  button.textContent =
    'กำลังส่งรีวิว...';


  const { error } =
    await supabaseClient
      .from('reviews')
      .insert({

        name: name,

        stars: selectedStar,

        review: review

      });


  if (error) {

    console.error(error);

    alert(
      'ส่งรีวิวไม่สำเร็จค่ะ: ' +
      error.message
    );

    button.disabled = false;

    button.textContent =
      'SEND REVIEW ♡';

    return;
  }


  alert(
    'ส่งรีวิวเรียบร้อยแล้วค่ะ ขอบคุณมากนะคะ ♡'
  );


  document
    .getElementById('name')
    .value = '';


  document
    .getElementById('review')
    .value = '';


  selectedStar = 0;


  document
    .querySelectorAll('.star')
    .forEach(star => {

      star.classList.remove(
        'selected'
      );

    });


  button.disabled = false;

  button.textContent =
    'SEND REVIEW ♡';


  document
    .getElementById('reviewForm')
    .classList
    .remove('show');


  await loadReviews();
}


/* ===================================
   LOAD REVIEWS
=================================== */

async function loadReviews() {

  const { data, error } =
    await supabaseClient
      .from('reviews')
      .select(
        'id,name,stars,review,created_at'
      )
      .order(
        'created_at',
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    document
      .getElementById('reviewsList')
      .innerHTML =
      '<div class="empty">' +
      'ไม่สามารถโหลดรีวิวได้' +
      '</div>';

    return;
  }


  const reviews =
    data || [];


  /* COUNT */

  document
    .getElementById('reviewCount')
    .textContent =
    reviews.length +
    (
      reviews.length === 1
        ? ' Review'
        : ' Reviews'
    );


  /* NO REVIEWS */

  if (reviews.length === 0) {

    document
      .getElementById('averageRating')
      .textContent =
      '0.0';


    document
      .getElementById('averageStars')
      .textContent =
      '☆☆☆☆☆';


    document
      .getElementById('reviewsList')
      .innerHTML =
      '<div class="empty">' +
      'ยังไม่มีรีวิวค่ะ ♡<br>' +
      'เป็นคนแรกที่รีวิวให้ร้านได้นะคะ' +
      '</div>';

    return;
  }


  /* AVERAGE */

  const total =
    reviews.reduce(
      (sum, item) =>
        sum + Number(item.stars),
      0
    );


  const average =
    total / reviews.length;


  document
    .getElementById('averageRating')
    .textContent =
    average.toFixed(1);


  document
    .getElementById('averageStars')
    .textContent =
    getStars(
      Math.round(average)
    );


  /* REVIEW LIST */

  const list =
    document.getElementById(
      'reviewsList'
    );


  list.innerHTML = '';


  reviews.forEach(item => {

    const card =
      document.createElement(
        'div'
      );

    card.className =
      'review-card';


    const header =
      document.createElement(
        'div'
      );

    header.className =
      'review-header';


    const avatar =
      document.createElement(
        'img'
      );

    avatar.className =
      'review-avatar';

    avatar.src =
      'profile.jpg';

    avatar.alt =
      'Customer';


    const info =
      document.createElement(
        'div'
      );


    const name =
      document.createElement(
        'div'
      );

    name.className =
      'reviewer-name';

    name.textContent =
      item.name;


    const stars =
      document.createElement(
        'div'
      );

    stars.className =
      'review-stars';

    stars.textContent =
      getStars(
        Number(item.stars)
      );


    info.appendChild(name);

    info.appendChild(stars);


    header.appendChild(avatar);

    header.appendChild(info);


    const text =
      document.createElement(
        'div'
      );

    text.className =
      'review-text';

    text.textContent =
      item.review;


    const date =
      document.createElement(
        'div'
      );

    date.className =
      'review-date';


    if (item.created_at) {

      date.textContent =
        new Date(
          item.created_at
        ).toLocaleDateString(
          'th-TH',
          {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          }
        );

    }


    card.appendChild(header);

    card.appendChild(text);

    card.appendChild(date);


    list.appendChild(card);

  });

}


/* ===================================
   STAR FUNCTION
=================================== */

function getStars(number) {

  return (
    '★'.repeat(number) +
    '☆'.repeat(5 - number)
  );

}


/* ===================================
   START
=================================== */

loadReviews();

</script>

</body>
</html>
